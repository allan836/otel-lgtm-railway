receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  otlphttp/openobserve:
    traces_endpoint: "${env:OPENOBSERVE_ENDPOINT}/v1/traces"
    metrics_endpoint: "${env:OPENOBSERVE_ENDPOINT}/v1/metrics"
    logs_endpoint: "${env:OPENOBSERVE_ENDPOINT}/v1/logs"
    headers:
      Authorization: "${env:OPENOBSERVE_AUTH}"
      stream-name: "default"

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/openobserve]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/openobserve]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/openobserve]
